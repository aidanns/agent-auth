[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gpg-bridge"
dynamic = ["version"]
description = "HTTP bridge that delegates GPG signing to the host gpg binary for agent-auth-protected callers"
requires-python = ">=3.11"
dependencies = [
    # keep-sorted start
    "agent-auth-common",
    "keyring>=25.0",
    "pyyaml>=6.0",
    # keep-sorted end
]

[project.scripts]
gpg-bridge = "gpg_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# See ``packages/agent-auth/pyproject.toml`` for the rationale on
# ``root = "../.."`` (issue #408).
root = "../.."
fallback_version = "0.0.0+unknown"

[tool.uv.sources]
agent-auth-common = { workspace = true }

[tool.pytest.ini_options]
# Per-package pytest config. See packages/agent-auth/pyproject.toml
# for the full rationale. ``tests/`` is on the pythonpath so the
# ``gpg_backend_fake`` test fake (run as ``python -m
# gpg_backend_fake`` by the bridge subprocess in unit tests)
# resolves as a top-level module from the workspace tree. ``-p
# tests_support.integration.plugin`` registers the workspace-wide
# Docker-backed integration fixtures (``gpg_bridge_stack`` etc.) so
# a per-package ``task gpg-bridge:test`` and a workspace-root
# ``task test`` both resolve them — the workspace pyproject loads
# the same plugin, but pytest's per-package ``rootdir`` resolution
# means a focused per-package run skips the workspace addopts.
addopts = [
    "-p",
    "tests_support.integration.plugin",
    "--import-mode=importlib",
    "--cov=gpg_bridge",
    "--cov-branch",
    "--cov-report=term-missing",
    # Floor lowered from 62 to 55 in #520 when the gpg subprocess +
    # HTTP wiring tests (test_gpg_bridge_server, test_gpg_bridge_perf_budget,
    # test_gpg_subprocess_client[_passphrase], test_bridge_network_drop,
    # plus the gpg_backend_fake-driven wedge in test_backend_subprocess_hang)
    # were relocated under ``tests/integration/`` so the per-package
    # ``test-unit`` shard's bare ``pytest`` invocation stops hitting
    # PYTHONPATH-resolution failures for ``gpg_backend_fake`` (only the
    # workspace ``task test`` path's ``_bootstrap_venv.sh`` exports the
    # required PYTHONPATH for that subprocess). Workspace ``task test``
    # only counts unit-shard coverage, so moving tests out of the unit
    # shard drops the unit-shard floor measurement; the moved tests
    # still execute (under ``test-integration.yml`` via
    # ``task test --integration``) but do not contribute to the gate's
    # input. 55 leaves a small headroom over the 58% currently observed
    # so the floor does not need to ratchet on every minor refactor.
    "--cov-fail-under=55",
]
pythonpath = [
    # keep-sorted start
    "../agent-auth-common/src",
    "src",
    "tests",
    # keep-sorted end
]
testpaths = ["tests"]

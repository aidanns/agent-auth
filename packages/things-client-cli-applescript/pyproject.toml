[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "things-client-cli-applescript"
dynamic = ["version"]
description = "macOS-only AppleScript-backed implementation of the things-client contract"
requires-python = ">=3.11"
dependencies = [
    # keep-sorted start
    "agent-auth-common",
    # keep-sorted end
]

[project.scripts]
things-client-cli-applescript = "things_client_applescript.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# See ``packages/agent-auth/pyproject.toml`` for the rationale on
# ``root = "../.."`` (issue #408).
root = "../.."
fallback_version = "0.0.0+unknown"

[tool.uv.sources]
agent-auth-common = { workspace = true }

[tool.pytest.ini_options]
# Per-package pytest config. See packages/agent-auth/pyproject.toml
# for the full rationale.
addopts = [
    "-p",
    "tests_support.integration.plugin",
    "--import-mode=importlib",
    "--cov=things_client_applescript",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=73",
]
markers = [
    "requires_real_things3: macOS-Tart-VM-only system test that drives a live Things 3 instance over real osascript. Skips unless AGENT_AUTH_REAL_THINGS3=1 on Darwin (only set inside the boot-prepped Tart VM). See ADR 0047.",
]
pythonpath = [
    # keep-sorted start
    "../agent-auth-common/src",
    "src",
    # keep-sorted end
]
testpaths = ["tests"]

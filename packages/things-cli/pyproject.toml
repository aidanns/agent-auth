[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "things-cli"
dynamic = ["version"]
description = "Command-line client for the Things 3 bridge (read-only)"
requires-python = ">=3.11"
dependencies = [
    # keep-sorted start
    "agent-auth-common",
    "keyring>=25.0",
    "pyyaml>=6.0",
    # keep-sorted end
]

[project.scripts]
things-cli = "things_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# See ``packages/agent-auth/pyproject.toml`` for the rationale on
# ``root = "../.."`` (issue #408).
root = "../.."
fallback_version = "0.0.0+unknown"

[tool.uv.sources]
agent-auth-common = { workspace = true }

[tool.pytest.ini_options]
# Per-package pytest config. See packages/agent-auth/pyproject.toml
# for the full rationale.
addopts = [
    "-p",
    "tests_support.integration.plugin",
    "--import-mode=importlib",
    "--cov=things_cli",
    "--cov-branch",
    "--cov-report=term-missing",
    # Lowered from 67% to 65% in #328 when the refresh + reissue retry
    # ladder moved out of ``things_cli.client`` into the shared
    # ``agent_auth_client.AuthenticatedRetry`` (ADR 0043). The
    # orchestration is still covered — by
    # ``packages/agent-auth-common/tests/test_authenticated_retry.py``
    # — but those statements no longer count toward this package's
    # ratio because ``--cov=things_cli`` is scoped to this package.
    "--cov-fail-under=65",
]
pythonpath = [
    # keep-sorted start
    "../agent-auth-common/src",
    "src",
    # keep-sorted end
]
testpaths = ["tests"]

# Open or update the release PR on every push to main.
#
# The workflow reads `changelog/@unreleased/pr-*.yml` and uses the
# shared `version_logic` library (#295) to compute the next version,
# then renders the new CHANGELOG section and the release-PR body via
# `scripts/changelog/build_release.py`. The branch name is
# `release/<X.Y.Z>` so the release-tag workflow can filter by head ref
# without parsing the title. Idempotent on re-run within the same
# release window — subsequent pushes refresh the same branch + PR.
#
# When the *next computed version* changes (e.g. a new YAML lifts the
# bump from patch to minor, or a `release-as` override is added), the
# workflow closes the previous `release/*` PR and opens a new one
# under the new version, so a stale PR never lingers ahead of an
# updated plan.
#
# Bot identity: PR creation, the release-branch push, the release
# commit's author/committer, AND the `Signed-off-by:` trailer
# embedded inside the ==COMMIT_MSG== block (which becomes the
# squash-merge body verbatim) all attribute to the
# `agent-auth-release-bot` GitHub App (secrets `RELEASE_BOT_APP_ID`
# and `RELEASE_BOT_PRIVATE_KEY`) via `actions/create-github-app-token`.
# The default `GITHUB_TOKEN` cannot open PRs unless the org/repo
# setting "Allow GitHub Actions to create and approve pull requests"
# is on, and enabling that flag would also let every workflow
# auto-approve PRs — too broad for a repo with DCO/signing rigour. The
# release branch push also runs under the App token so a future ruleset
# tightening on `release/*` does not silently break the release flow.
# DCO auto-bypasses the bot's `[bot]@users.noreply.github.com` email
# (`.github/workflows/dco.yml`) so unifying the committer identity does
# not affect the sign-off check.

name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Distinguish two configuration states before minting the App
      # token, since `actions/create-github-app-token` throws an opaque
      # `Parameter token or opts.auth is required` when either secret
      # is missing. The decision tree:
      #   - Neither secret set: treat as first-time setup (e.g. fork,
      #     or the PR that initially adds this workflow). Emit a
      #     `::notice::` pointing at the setup doc and skip the rest
      #     of the job. Same shape as changelog-bot.yml's guard.
      #   - Both set: proceed.
      #   - Exactly one set: partial / broken configuration in a live
      #     deployment (a secret was renamed or deleted). Emit a
      #     `::error::` so the cause is obvious in the run log, and
      #     fail the job non-zero so the misconfiguration is loud.
      - name: Check secrets are configured
        id: secrets-check
        env:
          APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID:-}" && -z "${PRIVATE_KEY:-}" ]]; then
            echo "::notice::RELEASE_BOT_APP_ID / RELEASE_BOT_PRIVATE_KEY secrets are not set; skipping release-pr run."
            echo "::notice::See docs/release/release-bot-setup.md for setup instructions."
            echo "configured=false" >> "${GITHUB_OUTPUT}"
          elif [[ -n "${APP_ID:-}" && -n "${PRIVATE_KEY:-}" ]]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            if [[ -z "${APP_ID:-}" ]]; then
              missing="RELEASE_BOT_APP_ID"
            else
              missing="RELEASE_BOT_PRIVATE_KEY"
            fi
            echo "::error::${missing} secret is not set but the other release-bot secret is; this is a partial / broken configuration."
            echo "::error::See docs/release/release-bot-setup.md for setup instructions."
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            exit 1
          fi

      # Mint a short-lived installation token from the
      # `agent-auth-release-bot` App. Used for the release-branch push
      # (so checkout persists it as the origin credential) and for the
      # `gh pr` steps below — the default `GITHUB_TOKEN` cannot open
      # PRs without globally widening workflow permissions.
      - name: Create GitHub App token
        id: app-token
        if: steps.secrets-check.outputs.configured == 'true'
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: steps.secrets-check.outputs.configured == 'true'
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        if: steps.secrets-check.outputs.configured == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install PyYAML
        if: steps.secrets-check.outputs.configured == 'true'
        # The build_release script depends on PyYAML (re-exported via
        # version_logic). Avoid the full workspace `uv sync` here —
        # this workflow only needs the changelog tooling.
        run: pip install --no-cache-dir 'pyyaml>=6'

      # mdformat (and uv, which provisions it) lives behind the shared
      # toolchain action. Needed for the post-apply CHANGELOG.md format
      # step below — without it the rendered CHANGELOG drifts from the
      # repo's mdformat conventions and the next-push `Check` job fails
      # `scripts/format.sh --check` on the release PR. See issue #356.
      - uses: ./.github/actions/setup-toolchain
        if: steps.secrets-check.outputs.configured == 'true'
        with:
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Resolve current version
        id: current
        if: steps.secrets-check.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if tag="$(git describe --tags --abbrev=0 --match 'v*.*.*' 2>/dev/null)"; then
            echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"
          else
            # First release ever — fall back to 0.0.0 so the very first
            # `feature` entry produces 0.1.0.
            echo "version=0.0.0" >> "${GITHUB_OUTPUT}"
          fi

      - name: Resolve release-bot identity
        # Resolve the App's bot slug + numeric user-id once and reuse
        # the values for both the `Compute release plan` step (which
        # threads them into the `Signed-off-by:` trailer rendered
        # inside the ==COMMIT_MSG== block, #398) and the
        # `Configure git identity` step below (author/committer on
        # the release commit). Single source of truth — the trailer
        # and the commit author can never disagree.
        id: bot
        if: steps.secrets-check.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        shell: bash
        run: |
          set -euo pipefail
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "app_slug=${APP_SLUG}" >> "${GITHUB_OUTPUT}"
          echo "user_id=${user_id}" >> "${GITHUB_OUTPUT}"

      - name: Compute release plan
        id: plan
        if: steps.secrets-check.outputs.configured == 'true'
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          BOT_APP_SLUG: ${{ steps.bot.outputs.app_slug }}
          BOT_USER_ID: ${{ steps.bot.outputs.user_id }}
        shell: bash
        run: |
          set -euo pipefail
          plan_json="$(python3 scripts/changelog/build_release.py compute \
            --repo-root . \
            --current-version "${CURRENT_VERSION}" \
            --bot-app-slug "${BOT_APP_SLUG}" \
            --bot-user-id "${BOT_USER_ID}")"
          # Persist the plan to a file (multiline JSON survives env
          # encoding via the file path; outputs would also work but
          # the body and changelog section are large).
          printf '%s' "${plan_json}" > /tmp/release-plan.json
          if jq -er '.skip == true' < /tmp/release-plan.json >/dev/null 2>&1; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "build_release: no unreleased entries; skipping release PR."
          else
            next="$(jq -r '.next_version' /tmp/release-plan.json)"
            branch="$(jq -r '.branch' /tmp/release-plan.json)"
            title="$(jq -r '.title' /tmp/release-plan.json)"
            echo "skip=false" >> "${GITHUB_OUTPUT}"
            echo "next_version=${next}" >> "${GITHUB_OUTPUT}"
            echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
            echo "title=${title}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Apply moves and rewrite CHANGELOG.md
        if: steps.secrets-check.outputs.configured == 'true' && steps.plan.outputs.skip == 'false'
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
        run: |
          python3 scripts/changelog/build_release.py apply \
            --repo-root . \
            --current-version "${CURRENT_VERSION}"

      - name: Format generated CHANGELOG.md
        # The apply step's renderer doesn't match the repo's mdformat
        # conventions (wrap, list-numbering, blank-line rules) byte for
        # byte, so without this step the next-push `Check` job fails
        # `scripts/format.sh --check` on the release PR and the maintainer
        # has to hand-reformat. Keep this narrowly scoped to CHANGELOG.md
        # rather than running `task format` over the full tree — only
        # CHANGELOG.md was just rewritten, and the subsequent
        # `git add changelog CHANGELOG.md` would drop any other rewrites
        # anyway. mdformat picks up `.mdformat.toml` automatically. See
        # issue #356.
        if: steps.secrets-check.outputs.configured == 'true' && steps.plan.outputs.skip == 'false'
        run: mdformat CHANGELOG.md

      - name: Configure git identity
        # Reuse the slug + numeric user-id resolved earlier in
        # `Resolve release-bot identity` so the author/committer on
        # the release commit, the `Signed-off-by:` trailer rendered
        # inside the ==COMMIT_MSG== block (#398), and the App
        # identity that opens the PR all attribute to the same
        # `agent-auth-release-bot[bot]`. DCO auto-bypasses because
        # `[bot]@users.noreply.github.com` is the suffix the check
        # matches on.
        if: steps.secrets-check.outputs.configured == 'true' && steps.plan.outputs.skip == 'false'
        env:
          BOT_APP_SLUG: ${{ steps.bot.outputs.app_slug }}
          BOT_USER_ID: ${{ steps.bot.outputs.user_id }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "${BOT_APP_SLUG}[bot]"
          git config user.email "${BOT_USER_ID}+${BOT_APP_SLUG}[bot]@users.noreply.github.com"

      - name: Create or refresh release branch
        if: steps.secrets-check.outputs.configured == 'true' && steps.plan.outputs.skip == 'false'
        env:
          BRANCH: ${{ steps.plan.outputs.branch }}
          NEXT: ${{ steps.plan.outputs.next_version }}
        shell: bash
        run: |
          set -euo pipefail
          # Stage the apply step's changes onto a fresh branch named
          # after the next version. force-push so a previous attempt
          # at the same version cleanly overwrites.
          git checkout -B "${BRANCH}"
          git add changelog CHANGELOG.md
          # If nothing actually changed (re-run with no new entries),
          # exit cleanly rather than commit an empty diff.
          if git diff --cached --quiet; then
            echo "release-pr: no diff to commit; release branch already up to date."
            exit 0
          fi
          git commit -s -m "chore(release): ${NEXT}"
          git push --force-with-lease origin "${BRANCH}"

      - name: Close superseded release PRs
        if: steps.secrets-check.outputs.configured == 'true' && steps.plan.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          KEEP_BRANCH: ${{ steps.plan.outputs.branch }}
          NEXT: ${{ steps.plan.outputs.next_version }}
        shell: bash
        run: |
          set -euo pipefail
          # List open PRs whose head ref starts with `release/`. Close
          # any whose ref doesn't match the freshly-computed branch
          # (e.g. a stale `release/0.5.0` when the plan now wants
          # `release/1.0.0`). Delete the stale branch so the next
          # iteration doesn't see it.
          mapfile -t stale < <(
            gh pr list --state open --json number,headRefName \
              --jq '.[] | select(.headRefName | startswith("release/")) | "\(.number) \(.headRefName)"'
          )
          for entry in "${stale[@]:-}"; do
            [[ -n "${entry}" ]] || continue
            number="${entry%% *}"
            ref="${entry#* }"
            if [[ "${ref}" == "${KEEP_BRANCH}" ]]; then
              continue
            fi
            echo "release-pr: superseding stale release PR #${number} (${ref}) -> ${KEEP_BRANCH}"
            gh pr close "${number}" --comment "Superseded by release \`v${NEXT}\` (\`${KEEP_BRANCH}\`)." --delete-branch || true
          done

      - name: Open or update release PR
        if: steps.secrets-check.outputs.configured == 'true' && steps.plan.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          TITLE: ${{ steps.plan.outputs.title }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(jq -r '.pr_body' /tmp/release-plan.json)"
          existing="$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')"
          # Apply `automerge` and `no changelog` on both create and update
          # paths so the merge-bot lands the release once required checks
          # pass. The release PR body is auto-rendered prose and carries
          # no hand-authored changelog YAML, so `no changelog` keeps
          # changelog-lint happy. Both labels are idempotent on re-run.
          # See ADR 0041 § Consequences ("Fully automated releases") and
          # issue #359.
          if [[ -n "${existing}" ]]; then
            echo "release-pr: updating existing PR #${existing}"
            gh pr edit "${existing}" --title "${TITLE}" --body "${body}" \
              --add-label automerge,'no changelog'
          else
            echo "release-pr: opening new PR for ${BRANCH}"
            gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "${TITLE}" \
              --body "${body}" \
              --label automerge,'no changelog'
          fi

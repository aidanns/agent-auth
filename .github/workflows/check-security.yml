name: check-security

# Security-cadence child of `ci.yml`. Carries CodeQL, ripsecrets, and
# the dependency-review / dependency-submission pair.

on:
  workflow_call:
    inputs:
      event_has_diff_base_head:
        # `actions/dependency-review-action` only supports events that
        # carry a base/head diff (`pull_request`, `pull_request_target`,
        # `merge_group`). Plumbed in from `ci.yml`'s `plan` job so the
        # leaf child can short-circuit elsewhere.
        description: True for events that carry a base/head diff.
        required: true
        type: boolean
      event_from_external_repo:
        # Fork PRs receive a read-only `GITHUB_TOKEN`; the dependency-
        # submission POST would 403. Plumbed in so that leaf can
        # short-circuit on fork PRs.
        description: True for `pull_request` events from a fork.
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  codeql-analyse:
    uses: ./.github/workflows/codeql-analyse.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  ripsecrets:
    uses: ./.github/workflows/ripsecrets.yml

  check-dependency-review:
    # Wait for `check-dependency-submission`'s POST so the review
    # action sees a head-SHA snapshot in the Dependency Graph
    # (otherwise it emits a sticky "no snapshots found" PR comment).
    # ADR 0046's aggregator already has both jobs in `needs:`, so a
    # `submit` failure that GitHub propagates as `skipped` here is
    # correctly rejected by `ci.yml`'s strict `skipped = failure`
    # rule (#441) — the review verdict against a missing snapshot
    # would be meaningless.
    needs: [check-dependency-submission]
    uses: ./.github/workflows/check-dependency-review.yml
    with:
      event_has_diff_base_head: ${{ inputs.event_has_diff_base_head }}
    permissions:
      contents: read
      pull-requests: write

  check-dependency-submission:
    uses: ./.github/workflows/check-dependency-submission.yml
    with:
      event_from_external_repo: ${{ inputs.event_from_external_repo }}
    permissions:
      contents: write

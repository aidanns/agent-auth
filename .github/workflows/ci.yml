name: CI

# Parent orchestrator for the uv-style nested `workflow_call` CI structure
# (issue #440). Today this workflow only carries the foundational shell:
# a `plan` job that emits label and changed-files gating booleans, and a
# `required-checks-passed` aggregator that consolidates upstream results
# into a single PR status check. Subsequent migration issues will move
# each existing PR-time `check-*` / `test-*` workflow under here as a
# `workflow_call` child and add it to the aggregator's `needs:` list.
#
# Until those children migrate, this workflow runs alongside (not in
# place of) the existing top-level workflows in `.github/workflows/`.
# It does not modify or remove any of them.

on:
  pull_request:
    # Activity types — `opened`, `synchronize`, `reopened`,
    # `ready_for_review` cover the diff-changing transitions; the
    # aggregator surfaces as a status check on every PR, including
    # draft → ready transitions. `labeled` and `unlabeled` are
    # included so PR-time workflows that gate on labels
    # (`check-changelog/exists` reading `no changelog`,
    # dependabot-adapter reading `automerge`) re-fire when the label
    # set changes — without them, applying `no changelog` after
    # `gh pr create` left ci.yml stuck on the original `labels=[]`
    # payload and `Required checks passed` reported a stale failure
    # (issue #527). The diff-dependent children are skipped on
    # label-only re-runs via the verified-prior-success path
    # below, so the wasted-runtime cost of widening the trigger
    # surface is bounded to the metadata-dependent children
    # (`check-changelog`, `check-pull-request`). Restricted to PRs
    # targeting `main` to match the convention every other PR-time
    # workflow in this repo (`test.yml`, `check.yml`,
    # `typecheck.yml`, ...) uses.
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

# Cancel only on `pull_request` runs: a fresh push to a PR branch
# obsoletes the in-flight run, but `push (main)`, `merge_group`, and
# `workflow_dispatch` runs each represent a discrete event whose
# completion (success or failure) we want recorded against that ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    # Outputs are surfaced for downstream child workflows so they can
    # gate on label decisions (`label_no_changelog` for the changelog
    # bypass, `label_automerge` for merge-eligible PRs) and changed-file
    # areas. Only the two labels that existing workflows in this repo
    # consume today (`automerge` — merge-bot, dependabot-adapter,
    # release-pr; `no changelog` — changelog-lint, dependabot-adapter,
    # release-pr) are emitted; further label outputs will be added as
    # subsequent migration issues land child workflows that need them.
    # Names are kept stable across the migration so child workflows
    # added in later issues can reference them without churning this
    # file.
    outputs:
      label_no_changelog: ${{ steps.labels.outputs.label_no_changelog }}
      label_automerge: ${{ steps.labels.outputs.label_automerge }}
      code_changed: ${{ steps.filter.outputs.code }}
      python_changed: ${{ steps.filter.outputs.python }}
      bash_changed: ${{ steps.filter.outputs.bash }}
      docs_changed: ${{ steps.filter.outputs.docs }}
      design_changed: ${{ steps.filter.outputs.design }}
      workflows_changed: ${{ steps.filter.outputs.workflows }}
      event_is_pull_request: ${{ steps.event.outputs.event_is_pull_request }}
      event_has_diff_base_head: ${{ steps.event.outputs.event_has_diff_base_head }}
      event_from_external_repo: ${{ steps.event.outputs.event_from_external_repo }}
      # Verified-prior-success flag (issue #527 / Option 4). `true`
      # only on `labeled` / `unlabeled` events whose head SHA already
      # has a non-failing conclusion for every diff-dependent child
      # check-run; downstream `<job>:` `if:` gates and the aggregator
      # carve-out both consume this. `false` on every other event
      # (the diff itself changed → prior check-runs are stale by
      # definition) and whenever the prior conclusion of any
      # diff-dependent child is `failure` / `cancelled` /
      # `timed_out` / `missing` (the safe-default branch).
      diff_dependent_jobs_already_passed: ${{ steps.prior.outputs.diff_dependent_jobs_already_passed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Compute event-kind gating booleans
        id: event
        # Centralise the event-kind decisions that downstream child
        # workflows need to gate steps on (issue #530), so individual
        # children don't replicate `github.event_name` /
        # `head.repo.full_name` checks. Three booleans because the
        # downstream gates are not identical:
        #   - `event_is_pull_request`: PR-only context (changelog
        #     presence/format depend on the PR diff and PR labels).
        #   - `event_has_diff_base_head`: events that carry a base/head
        #     diff (`pull_request`, `pull_request_target`, `merge_group`)
        #     — required by `actions/dependency-review-action`.
        #   - `event_from_external_repo`: PR from a fork. Used by checks
        #     whose write-token POSTs would 403 under the read-only
        #     fork-PR `GITHUB_TOKEN` (dependency-submission).
        # User-controlled metadata (`head.repo.full_name`) is routed
        # through env vars rather than inlined `${{ ... }}` expressions
        # inside `run:` so a maliciously-named fork repository cannot
        # inject shell syntax — same convention as the
        # `Compute label-driven gating booleans` step above.
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            event_is_pull_request=true
          else
            event_is_pull_request=false
          fi
          if [[ "${EVENT_NAME}" == "pull_request" \
              || "${EVENT_NAME}" == "pull_request_target" \
              || "${EVENT_NAME}" == "merge_group" ]]; then
            event_has_diff_base_head=true
          else
            event_has_diff_base_head=false
          fi
          if [[ "${EVENT_NAME}" == "pull_request" \
              && "${HEAD_REPO_FULL_NAME}" != "${REPOSITORY}" ]]; then
            event_from_external_repo=true
          else
            event_from_external_repo=false
          fi
          {
            echo "event_is_pull_request=${event_is_pull_request}"
            echo "event_has_diff_base_head=${event_has_diff_base_head}"
            echo "event_from_external_repo=${event_from_external_repo}"
          } >> "${GITHUB_OUTPUT}"

      - name: Compute label-driven gating booleans
        id: labels
        # Read the PR's labels via the event payload (joined into a
        # single comma-separated string) and emit a `label_<slug>`
        # output for each of the gating labels this repo actually uses.
        # The labels are routed through env vars rather than inlined
        # `${{ ... }}` expressions inside `run:` so user-controlled
        # label names cannot inject shell syntax.
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          emit_label() {
            local slug="$1"
            local needle="$2"
            if [[ ",${PR_LABELS}," == *",${needle},"* ]]; then
              echo "label_${slug}=true" >> "${GITHUB_OUTPUT}"
            else
              echo "label_${slug}=false" >> "${GITHUB_OUTPUT}"
            fi
          }
          # keep-sorted start
          emit_label automerge "automerge"
          emit_label no_changelog "no changelog"
          # keep-sorted end

      - name: Compute changed-files gating booleans
        id: filter
        # `dorny/paths-filter` produces one `<filter-name>` output per
        # group, set to `'true'` when any path in the PR's diff matches
        # the listed globs. Pinned by SHA per
        # `.claude/instructions/tooling-and-ci.md` § "Pin
        # release-affecting GitHub Actions to commit SHAs"; this
        # workflow is read-only today, but the pin matches the repo
        # convention (every other `uses:` in `.github/workflows/` is
        # SHA-pinned) and keeps Dependabot's bump channel reviewable.
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            code:
              - 'packages/**'
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
            bash:
              - '**/*.sh'
              - 'scripts/**'
            docs:
              - 'docs/**'
              - 'README.md'
              - 'CONTRIBUTING.md'
            design:
              - 'design/**'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'

      - name: Probe prior run state on this head SHA
        id: prior
        # Verified partial-rerun gate for label-only events
        # (issue #527 / Option 4). On `labeled` / `unlabeled` the
        # head SHA is identical to the previous `synchronize`'s
        # head SHA — so any check-run on that SHA whose conclusion
        # is non-failing is still authoritative. We probe each
        # diff-dependent child via the Checks API; if every one
        # is non-failing on this SHA, downstream `<job>:` blocks
        # skip via the `if:` gate below and the aggregator's
        # `skipped = failure` rule (#441) is relaxed for that
        # specific case. If ANY child's prior conclusion is
        # `failure` / `cancelled` / `timed_out` / `missing`, the
        # flag is `false` and downstream children run as today —
        # safe default, no regression.
        #
        # The Checks API endpoint
        # (`repos/{owner}/{repo}/commits/{sha}/check-runs`) accepts
        # the workflow-level `contents: read` permission, which the
        # `plan` job inherits — no additional permissions needed.
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          # On `opened` / `synchronize` / `reopened` /
          # `ready_for_review` the diff itself changed (or this is
          # the first run on the SHA), so prior check-runs are
          # stale by definition.
          if [[ "${EVENT_ACTION}" != "labeled" && "${EVENT_ACTION}" != "unlabeled" ]]; then
            echo "diff_dependent_jobs_already_passed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Diff-dependent check-run names — derived from
          # `required-checks-passed.needs:` minus the metadata-
          # dependent allowlist. Driving this from a helper rather
          # than enumerating inline keeps the list in lockstep with
          # ci.yml itself: when a new child is added to `needs:`,
          # the helper auto-extends and the carve-out covers it
          # without churning this file.
          diff_dependent=$(scripts/ci/diff-dependent-jobs.sh)

          rollup=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
            --paginate --jq '.check_runs')

          all=true
          while IFS= read -r name; do
            [[ -z "${name}" ]] && continue
            latest=$(jq -r --arg n "${name}" \
              '[.[] | select(.name == $n)] | sort_by(.started_at) | .[-1].conclusion // "missing"' \
              <<<"${rollup}")
            # `success` / `neutral` / `skipped` from a prior label-
            # aware run all preserve the SUCCESS contract for the
            # aggregator. Anything else (`failure`, `cancelled`,
            # `timed_out`, `missing`, `action_required`,
            # `startup_failure`, `null`) invalidates the skip and
            # the children re-run.
            case "${latest}" in
              success | neutral | skipped) ;;
              *)
                echo "::notice::diff-dependent job '${name}' conclusion=${latest} on head ${HEAD_SHA}; will re-run."
                all=false
                break
                ;;
            esac
          done <<<"${diff_dependent}"

          echo "diff_dependent_jobs_already_passed=${all}" >> "${GITHUB_OUTPUT}"

  check-fmt:
    # Intermediate orchestrator carrying formatting / lint children
    # (issue #452 lands `spdx-license-headers`; #459 will add treefmt
    # and ruff format alongside). `needs: plan` keeps the
    # label/changed-files outputs reachable for future children that
    # opt into changed-files gating.
    name: Check Fmt
    needs: [plan]
    # Diff-dependent: outcome is determined by code in the head SHA.
    # Skip on `labeled`/`unlabeled` re-runs whose head SHA already
    # passed (issue #527 / Option 4). The aggregator carve-out at
    # the bottom of this file converts the resulting `skipped`
    # result back into a SUCCESS contract, but only when the same
    # flag is true — so the relaxation can't fire unless the probe
    # in `plan` verified the prior pass.
    if: needs.plan.outputs.diff_dependent_jobs_already_passed != 'true'
    uses: ./.github/workflows/check-fmt.yml
  check-security:
    # Security-cadence child orchestrator (issue #447). Carries CodeQL
    # analyse today; `dependency-review`, `dependency-submission`, and
    # `ripsecrets` migrate underneath it in follow-up issues. The
    # security checks don't consume any of `plan`'s gating booleans
    # today (CodeQL scans the full repo every run), but the `needs:
    # plan` keeps a stable ordering so future security children can
    # reference plan outputs without churning this file.
    name: Check Security
    needs: [plan]
    # Diff-dependent — see `check-fmt` above for the gate contract.
    if: needs.plan.outputs.diff_dependent_jobs_already_passed != 'true'
    uses: ./.github/workflows/check-security.yml
    with:
      event_has_diff_base_head: ${{ needs.plan.outputs.event_has_diff_base_head == 'true' }}
      event_from_external_repo: ${{ needs.plan.outputs.event_from_external_repo == 'true' }}
    permissions:
      # Granted to the `check-security.yml` chain. workflow_call
      # permissions are intersected at every layer — the parent must
      # grant ≥ what any descendant requests, otherwise GitHub refuses
      # to start the run with `startup_failure`. Children today:
      #  - codeql-analyse: needs `security-events: write` to upload
      #    SARIF results.
      #  - check-dependency-review: needs `pull-requests: write` to
      #    post the comment-summary-in-pr findings on the PR.
      #  - check-dependency-submission: needs `contents: write` to
      #    POST the Dependency Graph snapshot.
      actions: read
      contents: write
      pull-requests: write
      security-events: write
  check-lint:
    # First `workflow_call` child landed under the parent issue #440
    # migration (Phase 2, issue #453). The `check-lint.yml` parent
    # shell currently fans out to `python.yml` (mypy + pyright);
    # follow-up issues attach more children (systems-engineering in
    # #454, ruff in #459). Per Strategy C, the original `typecheck.yml`
    # continues to run alongside this chain until the Phase 5 sweep.
    name: check-lint
    needs: [plan]
    # Diff-dependent — see `check-fmt` above for the gate contract.
    if: needs.plan.outputs.diff_dependent_jobs_already_passed != 'true'
    uses: ./.github/workflows/check-lint.yml
    secrets: inherit
  check-docs:
    # Placeholder docs-build slot (issue #464). The slot is reserved
    # so the migration structure stays uniform; the child workflow is
    # always-passing until agent-auth gains a docs site. See
    # `.github/workflows/check-docs.yml` for the TODO marker.
    name: check-docs
    needs: [plan]
    # Diff-dependent — see `check-fmt` above for the gate contract.
    if: needs.plan.outputs.diff_dependent_jobs_already_passed != 'true'
    uses: ./.github/workflows/check-docs.yml

  test-unit:
    # Per-package unit-test matrix slot (issue #461). Carries the
    # workspace-member matrix from `test.yml`'s `unit` job, reshaped
    # to emit one `unit-tests (<package>)` parens-variant check
    # context per workspace member (#414 naming convention). Per
    # strategy C (#440), the original top-level `test.yml` stays in
    # place; both `test.yml`'s `unit` job and this matrix run in
    # parallel until Phase 5 retires the original.
    name: test-unit
    needs: [plan]
    # Diff-dependent — see `check-fmt` above for the gate contract.
    if: needs.plan.outputs.diff_dependent_jobs_already_passed != 'true'
    uses: ./.github/workflows/test-unit.yml

  test-integration:
    # Per-package Docker-backed integration-test matrix slot (issue
    # #461). Carries the `integration-<package>` jobs from
    # `test.yml`, renamed to `integration-tests (<package>)` per the
    # #414 parens-variant naming convention. Strategy C: original
    # workflow runs in parallel until Phase 5.
    name: test-integration
    needs: [plan]
    # Diff-dependent — see `check-fmt` above for the gate contract.
    if: needs.plan.outputs.diff_dependent_jobs_already_passed != 'true'
    uses: ./.github/workflows/test-integration.yml

  test-smoke:
    # Install-from-wheels smoke-test matrix slot (issue #461).
    # Carries `test.yml`'s `install-from-wheels` matrix verbatim;
    # the matrix already conformed to the parens-variant naming
    # convention so no rename is needed. Strategy C: original
    # workflow runs in parallel until Phase 5.
    name: test-smoke
    needs: [plan]
    # Diff-dependent — see `check-fmt` above for the gate contract.
    if: needs.plan.outputs.diff_dependent_jobs_already_passed != 'true'
    uses: ./.github/workflows/test-smoke.yml

  test-system:
    # macOS-runner system-test slot (issue #461). Carries
    # `test.yml`'s `macos-applescript` job (one job today; future
    # system-level tests will land alongside). Strategy C: original
    # workflow runs in parallel until Phase 5.
    name: test-system
    needs: [plan]
    # Diff-dependent — see `check-fmt` above for the gate contract.
    if: needs.plan.outputs.diff_dependent_jobs_already_passed != 'true'
    uses: ./.github/workflows/test-system.yml
  build:
    # Production-artifact build child workflow (issue #460). Runs
    # `scripts/build-release-artifacts.sh` and asserts the per-package
    # wheel + sdist count matches the workspace-member count, catching
    # the silent build-regression failure mode (#324, #325). Strategy
    # C: the original top-level `release-dryrun.yml` workflow stays in
    # place and runs in parallel with this chain until the
    # branch-protection ruleset switches to this aggregator (#5.2).
    name: build
    needs: [plan]
    # Diff-dependent — see `check-fmt` above for the gate contract.
    if: needs.plan.outputs.diff_dependent_jobs_already_passed != 'true'
    uses: ./.github/workflows/build.yml

  check-release:
    # Release-pipeline simulation child workflow (issue #460). Builds
    # the artefacts independently (no `dist/` handoff from `build`)
    # and exercises the `release-bot.yml` `publish-assets` upload
    # mechanics WITHOUT publishing a release, surfacing upload-path
    # regressions at PR time. Strategy C: the original top-level
    # `release-dryrun.yml` workflow stays in place and runs in
    # parallel with this chain until the branch-protection ruleset
    # switches to this aggregator (#5.2).
    name: check-release
    needs: [plan]
    # Diff-dependent — see `check-fmt` above for the gate contract.
    if: needs.plan.outputs.diff_dependent_jobs_already_passed != 'true'
    uses: ./.github/workflows/check-release.yml
  check-standards:
    # Project-standards slot (issue #455). Runs `task verify-standards`
    # via `scripts/verify-standards.sh`. Until Phase 5 of #440 retires
    # the original top-level workflow, the legacy `verify-standards.yml`
    # continues to run in parallel; this PR does not delete it and does
    # not modify the branch-protection ruleset (strategy C).
    name: check-standards
    needs: [plan]
    # Diff-dependent — see `check-fmt` above for the gate contract.
    if: needs.plan.outputs.diff_dependent_jobs_already_passed != 'true'
    uses: ./.github/workflows/check-standards.yml
  check-pull-request:
    # PR-metadata child workflow (issue #450). Houses jobs that
    # validate the pull-request envelope itself — DCO sign-off today;
    # pr-lint validators (title, body, commit-message block) follow
    # under #4.18 — rather than the working tree's contents. Strategy
    # C: the original top-level `dco.yml` workflow stays in place and
    # runs in parallel with this chain until the branch-protection
    # ruleset switches to this aggregator (#5.2).
    name: check-pull-request
    needs: [plan]
    uses: ./.github/workflows/check-pull-request.yml
  check-publish:
    # Publish-readiness slot (issue #462). Builds the release-asset
    # set with `scripts/build-release-artifacts.sh` and runs
    # `uv publish --dry-run` (against TestPyPI) plus `twine check`
    # against the built wheels and sdists. Net-new check — there is
    # no original top-level workflow for Strategy C (#440 Phase 5)
    # to retire later. The branch-protection ruleset is untouched
    # in this PR.
    name: check-publish
    needs: [plan]
    # Diff-dependent — see `check-fmt` above for the gate contract.
    if: needs.plan.outputs.diff_dependent_jobs_already_passed != 'true'
    uses: ./.github/workflows/check-publish.yml
  check-changelog:
    # Changelog gating slot (issue #451). Splits the legacy
    # `changelog-lint.yml` into two named jobs (`exists`, `format`) so
    # entry presence and schema validity surface as separate signals.
    # The legacy workflow continues to run alongside this child until
    # the Strategy-C cutover (#440 Phase 5).
    name: check-changelog
    needs: [plan]
    uses: ./.github/workflows/check-changelog.yml
    with:
      event_is_pull_request: ${{ needs.plan.outputs.event_is_pull_request == 'true' }}

  required-checks-passed:
    # Repo-wide aggregator (#440 "Decisions (locked in)"): a single
    # `Required checks passed` status check sits at the top of `ci.yml`
    # and gates every PR. Subsequent migration issues add each
    # `workflow_call` child workflow's job name to `needs:` here. The
    # branch-protection ruleset switch from per-workflow required
    # checks to this one aggregator is tracked under #5.2.
    name: Required checks passed
    needs: [plan, check-docs, check-changelog, check-publish, check-pull-request, check-lint, check-standards, build, check-release, check-security, check-fmt, test-unit, test-integration, test-smoke, test-system]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required checks passed
        # Pass `needs` through `env:` so the JSON survives shell
        # quoting verbatim — child job names that contain colons or
        # quotes would otherwise break the inline expansion. `jq -e`
        # exits non-zero on a `false` boolean, so the step fails
        # whenever any upstream `needs.*.result` is anything other
        # than `success`. Per issue #441 ("fails on any
        # failed/skipped/timed-out result"), `skipped` is treated as
        # a failure alongside `failure`, `cancelled`, and `timed_out`
        # — a child workflow that legitimately opts out via `if:`
        # will need to surface a `success` result (e.g. via a
        # short-circuit step) rather than skipping the job
        # altogether.
        #
        # Carve-out (issue #527 / Option 4): when a `labeled`/
        # `unlabeled` event re-runs ci.yml and the `plan` job's
        # probe step verified that every diff-dependent child
        # already produced a non-failing conclusion on the same
        # head SHA, those children skip via the `if:` gate above.
        # `skipped` then maps to SUCCESS for that specific set —
        # but ONLY when `diff_dependent_jobs_already_passed ==
        # 'true'`, AND ONLY for the ci.yml job IDs in
        # DIFF_DEPENDENT_JOB_IDS below. Anything outside that set
        # (the metadata-dependent children `check-changelog` and
        # `check-pull-request`, plus `plan` itself) keeps the
        # original strict #441 contract. The carve-out can't fire
        # without the verified-prior-success flag, so a label
        # change against a SHA whose CI never finished still
        # fails on `skipped` — by design.
        env:
          NEEDS: ${{ toJSON(needs) }}
          DIFF_DEPENDENT_JOBS_ALREADY_PASSED: ${{ needs.plan.outputs.diff_dependent_jobs_already_passed }}
          # Mirror of the diff-dependent ci.yml job IDs that
          # `scripts/ci/diff-dependent-jobs.sh` enumerates (the
          # script outputs LEAF check-run names; here we need the
          # parent ci.yml job IDs that show up as keys in
          # `needs.*`). Drift between this list and the script is
          # caught by `tests/test_ci_diff_dependent_probe.py`.
          DIFF_DEPENDENT_JOB_IDS: |
            check-fmt
            check-security
            check-lint
            check-docs
            check-publish
            check-release
            check-standards
            build
            test-unit
            test-integration
            test-smoke
            test-system
        run: |
          set -euo pipefail
          # Build a jq-side set of the diff-dependent job IDs from
          # the env list. Strip blank lines so the YAML block
          # scalar's trailing newline doesn't add an empty key.
          diff_dependent_set=$(printf '%s\n' "${DIFF_DEPENDENT_JOB_IDS}" \
            | awk 'NF' \
            | jq -R . \
            | jq -s 'map({(.): true}) | add')

          echo "${NEEDS}" \
            | jq -e \
                --arg flag "${DIFF_DEPENDENT_JOBS_ALREADY_PASSED}" \
                --argjson dd "${diff_dependent_set}" \
                'to_entries
                  | all(
                      .value.result == "success"
                      or (
                        $flag == "true"
                        and ($dd[.key] // false)
                        and .value.result == "skipped"
                      )
                    )' \
            > /dev/null

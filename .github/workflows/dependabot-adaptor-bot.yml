name: dependabot-adaptor-bot

# Adapt Dependabot PRs to the project's PR conventions so they pass
# the required `pr-lint` and `changelog-lint` checks without manual
# intervention. Dependabot only writes a PR title plus an upstream
# release-notes body — neither the curated `==COMMIT_MSG==` block
# (ADR 0037, .github/workflows/pr-lint.yml) nor the changelog-entry
# requirement (.github/workflows/changelog-lint.yml) is satisfied
# out of the box.
#
# What this does on every `dependabot[bot]` PR:
#
#   1. Prepends a synthesized `==COMMIT_MSG==` block (with a
#      Dependabot `Signed-off-by:` trailer that mirrors the trailer
#      Dependabot already puts on its own commits, so the squash-
#      merge body lands on `main` with valid DCO).
#   2. Inserts a `==NO_CHANGELOG==` marker line after the block so
#      `scripts/changelog/bot.py`'s decision tree takes Arm 1 on
#      its next wake-up — Dependabot upgrades are `chore(deps)`
#      and don't warrant a CHANGELOG entry, and the bot uses the
#      marker (not the label) as the source of truth. Without the
#      marker, the bot's Arm 2 strips the label as soon as it
#      sees a body that lacks the marker but carries the label
#      (issue #551).
#   3. Applies the `no changelog` label so `scripts/changelog/lint.py`
#      bypasses the changelog-file requirement on the same PR run
#      that triggered this workflow (the marker drives the bot on
#      future events, but the label is what the lint reads).
#   4. Applies the `automerge` label — hands the PR to merge-bot
#      (.github/workflows/merge-bot.yml, ADR 0038) once every
#      required check is green.
#
# Both edits go through the `agent-auth-changelog-bot` App token
# (not `secrets.GITHUB_TOKEN`) because GitHub does not fire
# downstream workflows for events caused by `GITHUB_TOKEN` — the
# label-add must trigger merge-bot's `pull_request: labeled` and the
# body-edit must trigger pr-lint's `pull_request_target: edited`.
# App-token-driven events do trigger downstream workflows.
#
# Runs on `pull_request_target` (NOT `pull_request`) — counter to
# the default fork-safety stance for App-token workflows — because
# Dependabot-authored PRs run their workflows in the **Dependabot
# secrets context**, not the Actions secrets context. The
# `CHANGELOG_BOT_APP_ID` / `CHANGELOG_BOT_PRIVATE_KEY` App
# credentials are provisioned in the Actions store, so under
# `pull_request` they resolve to empty inside a Dependabot run and
# the secrets-check guard below short-circuits the adaptor (issue
# #537). `pull_request_target` runs in the base-repo context and
# resolves the Actions secrets normally, avoiding a duplicate
# secret store to keep in sync on App key rollovers.
#
# Why the standard `pull_request_target` risk does not apply here:
# the canonical exploit is "checkout the PR ref, run its build,
# leak the elevated token". This workflow never checks out the PR.
# Every step is either a bash block whose inputs come from `env:`
# bindings populated from `${{ secrets.* }}` or from
# `github.event.pull_request.{number,user.login}` (both controlled
# by GitHub, not the PR author), or a `gh pr edit / view` call by
# PR number. The single piece of PR-author-controlled data that
# enters a `run:` block is the existing PR body fetched via
# `gh pr view ... --jq .body`, and it is only `grep -Fq`'d for a
# literal `==COMMIT_MSG==` marker — never executed, eval'd, or
# string-interpolated into a shell command. There is no
# PR-bytes -> code-execution path.
#
# The `if:` gate (`user.login == 'dependabot[bot]'`) remains
# spoof-proof under `pull_request_target`: GitHub sets `user.login`
# from the authenticated PR author, not from any PR-controlled
# field, and the `dependabot[bot]` login is reserved for the
# Dependabot App. Dependabot PRs are also always pushed to
# branches in the base repo, never from forks, so the fork-PR
# threat surface that motivates `pull_request` for human-authored
# PRs does not apply to the cohort this workflow runs on.
#
# !!! TRUST-MODEL GUARD !!!
# Introducing `actions/checkout` of the PR ref into this workflow
# (or flowing any other `${{ github.event.pull_request.* }}` /
# `${{ github.event.head_commit.* }}` value into a `run:` block as
# code rather than as a `grep` / `gh pr edit` argument) invalidates
# the trust argument above. Any such change MUST trigger a
# re-evaluation of the `pull_request_target` decision, including
# the option to revert to `pull_request` and accept the secrets-
# context constraint by duplicating the App credentials into the
# Dependabot secrets store.
#
# Idempotent: re-running on a fully-adapted PR is a no-op (the body
# edit is skipped when both markers are already present; `gh pr edit
# --add-label` is a no-op for labels already applied). A PR adapted
# by an earlier version of this workflow that lacks the
# `==NO_CHANGELOG==` marker (issue #551) is healed in-place by
# prepending only the missing marker — the existing `==COMMIT_MSG==`
# block is left untouched so the squash commit body does not change.

on:
  pull_request_target:
    # `synchronize` is included so the adaptor picks up Dependabot
    # PRs that were opened before the workflow shipped (their next
    # rebase / `@dependabot recreate` push fires `synchronize`),
    # and so PRs adapted by an earlier version of this workflow can
    # be healed in-place when the marker contract changes (#551).
    # Idempotency is enforced by the per-marker check below — when
    # both markers are already in the body, the body edit is a
    # no-op, which means a maintainer who removes the `automerge`
    # label mid-flight is not fought by the adaptor.
    types: [opened, reopened, synchronize]

permissions:
  # Workflow-level perms stay minimal — the App token mints its own
  # `pull-requests: write` for the body edit and label adds. See
  # changelog-bot.yml for the same pattern.
  contents: read
  pull-requests: read

jobs:
  adapt:
    runs-on: ubuntu-latest
    # `dependabot[bot]` is the GitHub-assigned login for the
    # Dependabot App; a fork PR's `user.login` is always the fork
    # owner, never the bot login, so this gate cannot be spoofed.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      # Bail out cleanly when the bot's secrets haven't been
      # provisioned yet (e.g. on the PR that adds this workflow, or
      # in a fork that hasn't installed the App). Mirrors the
      # changelog-bot pattern so a not-yet-configured environment
      # doesn't fail the PR.
      - name: Check secrets are configured
        id: secrets-check
        env:
          APP_ID: ${{ secrets.CHANGELOG_BOT_APP_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID:-}" ]]; then
            echo "::notice::CHANGELOG_BOT_APP_ID secret is not set; skipping adaptor run."
            echo "::notice::See docs/release/changelog-bot-setup.md for setup instructions."
            echo "configured=false" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create GitHub App token
        if: steps.secrets-check.outputs.configured == 'true'
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          app-id: ${{ secrets.CHANGELOG_BOT_APP_ID }}
          private-key: ${{ secrets.CHANGELOG_BOT_PRIVATE_KEY }}

      - name: Inject ==COMMIT_MSG== / ==NO_CHANGELOG== markers and apply labels
        if: steps.secrets-check.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          existing_body=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" \
            --json body --jq .body)

          # Per-marker checks rather than a single short-circuit so
          # PRs adapted by an earlier version of this workflow (which
          # injected only `==COMMIT_MSG==`) can be healed in-place
          # by prepending the missing `==NO_CHANGELOG==` marker
          # without disturbing their existing block (issue #551).
          has_commit_msg=false
          has_no_changelog=false
          if printf '%s' "${existing_body}" | grep -Fq '==COMMIT_MSG=='; then
            has_commit_msg=true
          fi
          if printf '%s' "${existing_body}" | grep -Fxq '==NO_CHANGELOG=='; then
            has_no_changelog=true
          fi

          # The `==NO_CHANGELOG==` marker sits OUTSIDE the
          # `==COMMIT_MSG==` block so the squash commit body
          # (extracted between the two `==COMMIT_MSG==` lines) does
          # not carry it, while
          # `scripts/changelog/bot.py:has_no_changelog_marker`
          # still finds it as a flush-left line in the active body.
          # printf (rather than a heredoc) keeps every line
          # flush-left regardless of YAML script indentation —
          # leading whitespace on a marker line would defeat
          # `scripts/validate-commit-msg-block.py:extract_block`.
          tmp=$(mktemp)
          # `"${var}"` here is a boolean-as-command: the variable
          # holds the literal string `true` or `false`, both of
          # which are shell built-ins that exit 0 / 1 respectively.
          if "${has_commit_msg}" && "${has_no_changelog}"; then
            echo "::notice::PR #${PR_NUMBER} already has both markers; body is unchanged."
          elif "${has_commit_msg}"; then
            # Legacy adapted PR — block is already in place.
            # Prepend only the missing `==NO_CHANGELOG==` marker so
            # the squash commit body extracted between the two
            # `==COMMIT_MSG==` lines does not change.
            printf '%s\n' '==NO_CHANGELOG==' '' > "${tmp}"
            printf '%s' "${existing_body}" >> "${tmp}"
            gh pr edit "${PR_NUMBER}" --repo "${REPO}" --body-file "${tmp}"
            echo "::notice::Prepended ==NO_CHANGELOG== marker to PR #${PR_NUMBER} body (block already present)."
          else
            # Fresh PR — neither marker is in place. Body + trailers
            # only per #478 — the squash subject comes from the PR
            # title via the merge API's `commit_title` field, so the
            # block must NOT carry its own subject line.
            printf '%s\n' \
              '==COMMIT_MSG==' \
              'See the PR description for upstream release notes.' \
              '' \
              'Signed-off-by: dependabot[bot] <support@github.com>' \
              '==COMMIT_MSG==' \
              '' \
              '==NO_CHANGELOG==' \
              '' \
              > "${tmp}"
            printf '%s' "${existing_body}" >> "${tmp}"
            gh pr edit "${PR_NUMBER}" --repo "${REPO}" --body-file "${tmp}"
            echo "::notice::Prepended ==COMMIT_MSG== block and ==NO_CHANGELOG== marker to PR #${PR_NUMBER} body."
          fi

          # Labels are idempotent — `gh pr edit --add-label` is a
          # no-op for labels already applied.
          gh pr edit "${PR_NUMBER}" --repo "${REPO}" \
            --add-label "no changelog" \
            --add-label "automerge"
          echo "::notice::Applied 'no changelog' and 'automerge' labels to PR #${PR_NUMBER}."

name: Python

# `workflow_call` child of `check-lint.yml` carrying the Python lint +
# static analysis jobs (ruff + mypy + pyright). Migrated from the
# standalone `typecheck.yml` workflow under the uv-style nested CI
# structure (parent issue #440, Phase 2 issue #453; ruff added under
# issue #459). Per the strategy-C decision locked in 2026-05-01, the
# originals (`typecheck.yml`, `check.yml`) continue to run alongside
# this child until the Phase 5 sweep deletes them; do not remove them
# from here.
#
# The original `typecheck.yml` ran a single `typecheck` job that
# invoked `task typecheck` (which calls `scripts/typecheck.sh` →
# `mypy` then `pyright` sequentially). This file splits the two
# checkers into separate sibling jobs so they parallelise across CI
# runners; the `ruff` sibling added in #459 follows the same per-tool
# pattern. mypy and pyright source `scripts/_bootstrap_venv.sh` (the
# same helper `scripts/typecheck.sh` uses) so the per-OS/arch venv is
# created and `UV_PROJECT_ENVIRONMENT` is exported, then `exec` their
# tool through `uv run --no-sync`; going through `task typecheck`
# would re-couple the two checkers serially. `ruff` runs the
# `setup-toolchain`-installed system binary directly — no project
# venv required, matching how `scripts/lint.sh` invokes it locally.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ruff check
        # Mirror `scripts/lint.sh`'s ruff invocation exactly: scope to
        # tracked `*.py` files via `git ls-files` so the lint surface
        # matches what authors run locally and skips any stray files
        # left in the working tree. `scripts/lint.sh` itself bundles
        # ruff with shellcheck + keep-sorted, so we cannot just call
        # `task lint` here without pulling those into the `ruff` job —
        # they belong to their own (future) check-lint children.
        run: |
          set -euo pipefail
          python_files_raw="$(git ls-files '*.py')"
          if [[ -z "${python_files_raw}" ]]; then
            echo "No *.py files tracked; skipping ruff check."
            exit 0
          fi
          mapfile -t python_files <<<"${python_files_raw}"
          ruff check "${python_files[@]}"

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run mypy
        run: |
          set -euo pipefail
          # shellcheck source=scripts/_bootstrap_venv.sh
          source scripts/_bootstrap_venv.sh
          exec uv run --no-sync mypy

  pyright:
    name: pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run pyright
        run: |
          set -euo pipefail
          # shellcheck source=scripts/_bootstrap_venv.sh
          source scripts/_bootstrap_venv.sh
          exec uv run --no-sync pyright

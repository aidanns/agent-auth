name: python

# Python lint + static analysis child of `check-lint.yml`. Three
# parallel jobs: `ruff` (lint), `mypy`, `pyright`. mypy / pyright
# both source `scripts/_bootstrap_venv.sh` (the per-OS/arch venv
# helper `scripts/typecheck.sh` uses) and `exec uv run --no-sync`
# their tool — splitting the two so they parallelise across runners
# rather than running serially through `task typecheck`. `ruff`
# uses the `setup-toolchain`-installed system binary directly,
# matching `scripts/lint.sh`.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ruff check
        # Mirror `scripts/lint.sh`'s ruff invocation exactly: scope to
        # tracked `*.py` files via `git ls-files` so the lint surface
        # matches what authors run locally and skips any stray files
        # left in the working tree. `scripts/lint.sh` itself bundles
        # ruff with shellcheck + keep-sorted, so we cannot just call
        # `task lint` here without pulling those into the `ruff` job —
        # they belong to their own (future) check-lint children.
        run: |
          set -euo pipefail
          python_files_raw="$(git ls-files '*.py')"
          if [[ -z "${python_files_raw}" ]]; then
            echo "No *.py files tracked; skipping ruff check."
            exit 0
          fi
          mapfile -t python_files <<<"${python_files_raw}"
          ruff check "${python_files[@]}"

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run mypy
        run: |
          set -euo pipefail
          # shellcheck source=scripts/_bootstrap_venv.sh
          source scripts/_bootstrap_venv.sh
          exec uv run --no-sync mypy

  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run pyright
        run: |
          set -euo pipefail
          # shellcheck source=scripts/_bootstrap_venv.sh
          source scripts/_bootstrap_venv.sh
          exec uv run --no-sync pyright

name: check-standards

# Project-standards child of `ci.yml`. Runs `task verify-standards`
# (-> `scripts/verify-standards.sh`): Taskfile coverage, Dependabot
# ecosystem coverage, bash CI gating, `uv.lock` sync.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify-standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Project Standards
        run: task verify-standards

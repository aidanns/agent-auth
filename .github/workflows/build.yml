name: build

# Production-artifact build child of `ci.yml`. Runs
# `scripts/build-release-artifacts.sh` (same script `release-bot.yml`
# invokes on tag push) into a temp `dist/`, then asserts the
# per-package artefact set is present. Catches build regressions
# the release pipeline would otherwise tag through silently (#324,
# #325).
#
# Independent build: this workflow does NOT upload `dist/` for the
# sibling `check-release.yml` to consume — both paths build
# separately so a regression in either lights up its own check.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Pin uv to the same version `release-bot.yml` uses so the
      # PR-time build's environment matches the publish path.
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.7"
          enable-cache: true

      # Required gate: a build failure here fails the job's
      # check-run conclusion, which blocks merge via the parent
      # aggregator's `needs.*.result == "success"` policy.
      - name: Build into temp dist/
        run: scripts/build-release-artifacts.sh --out dist

      # Per-package release-asset layout (ADR 0044): one wheel + one
      # sdist per workspace member. The expected count is derived from
      # `packages/<svc>/pyproject.toml` so adding a new workspace
      # member tightens the gate automatically with no edit here. A
      # regression that drops one package's pair will fail the assert
      # — the looser "at least one" gate this replaces could not.
      - name: Assert expected artefact set
        shell: bash
        run: |
          set -euo pipefail
          expected=$(find packages -mindepth 2 -maxdepth 2 -name pyproject.toml | wc -l)
          if [[ "${expected}" -lt 1 ]]; then
            echo "::error::no workspace members found under packages/* — build count derivation is broken"
            exit 1
          fi
          # `nullglob` makes an unmatched glob expand to nothing
          # rather than the literal pattern, so the array stays empty
          # if the build step somehow produced no dist/ contents.
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [[ -d dist ]]; then
            echo "Built artefacts in dist/:"
            ls -1 dist/ | sed 's/^/  /'
          else
            echo "No dist/ directory present."
          fi
          fail=0
          if [[ "${#wheels[@]}" -ne "${expected}" ]]; then
            echo "::error::expected ${expected} .whl artefacts (one per workspace member), got ${#wheels[@]}"
            fail=1
          fi
          if [[ "${#sdists[@]}" -ne "${expected}" ]]; then
            echo "::error::expected ${expected} .tar.gz sdist artefacts (one per workspace member), got ${#sdists[@]}"
            fail=1
          fi
          if [[ "${fail}" -eq 0 ]]; then
            echo "OK: ${#wheels[@]} wheel(s), ${#sdists[@]} sdist(s) for ${expected} workspace member(s)."
          fi
          exit "${fail}"

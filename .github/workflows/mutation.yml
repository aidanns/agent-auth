name: mutation

# Mutation-testing child of `nightly.yml`. Runtime is
# O(mutants × focused-test-run) and too expensive for every PR;
# `nightly.yml`'s cron + `workflow_dispatch` surface it nightly /
# on-demand. ADR 0021 documents the rationale.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    # Hard timeout below the default 6-hour runner limit so a
    # runaway mutation run (e.g. a new mutant in a test-lookup loop)
    # gets cut off cleanly rather than burning compute minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run mutation test and gate score
        run: task mutation-test

      - name: Upload mutation stats
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutmut-stats
          path: mutants/mutmut-cicd-stats.json
          if-no-files-found: warn

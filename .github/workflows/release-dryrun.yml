# PR-time dry-run of the release-build step (#325).
#
# Runs `scripts/build-release-artifacts.sh` — the same script
# `release-publish.yml` invokes on tag push — into a temp `dist/` dir,
# then asserts the expected artefact set is present. No signing, no
# SBOM generation, no upload. The job exists to catch the workspace-
# split-style regression where the build silently breaks but the
# release pipeline keeps tagging + writing CHANGELOG entries (the
# release "looks" successful from the outside).
#
# Soak status: the job is informational (`continue-on-error: true`)
# until issue #324 lands and unbreaks the build. After that the build
# step in `release-publish.yml` and this dry-run will both go green
# on `main`, and a follow-up config-only PR can flip the toggle and
# add this check to branch protection's required-status-checks set —
# at which point a broken release-build step becomes unmergeable.

name: Release Dryrun

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel an in-flight dry-run when a new commit lands on the same PR
# (or `main` push). The dry-run is informational during the soak window
# and runs on every push, so without this a force-push or rapid `git
# push` cycle queues full duplicate runs against stale heads. Other
# release-affecting workflows (release-publish, release-tag) use
# `cancel-in-progress: false` to protect mid-release state; the
# dry-run has no such state to protect.
concurrency:
  group: release-dryrun-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Pin uv to the same version `release-publish.yml` uses so the
      # dry-run's build environment matches the publish path.
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.7"
          enable-cache: true

      # Informational gate during the #325 soak window — see header.
      # `continue-on-error: true` on the build + assert steps means a
      # broken release-build path shows up as a red sub-step inside
      # the job (visible to anyone clicking through), while the job's
      # check-run conclusion stays green so the rollup doesn't block
      # PR merges. Removing both lines is the explicit signal that
      # the gate is now required and a follow-up config-only PR adds
      # the check to branch-protection's required-status-checks set.
      #
      # Step-level (not job-level) continue-on-error is load-bearing:
      # a job-level toggle leaves the *job's* check-run reporting
      # FAILURE even when the workflow's conclusion is success, which
      # then blocks the merge-bot's rollup gate.
      - name: Build into temp dist/
        continue-on-error: true
        run: scripts/build-release-artifacts.sh --out dist

      # Per-package release-asset layout (ADR 0044): one wheel + one
      # sdist per workspace member. The expected count is derived from
      # `packages/<svc>/pyproject.toml` so adding a new workspace
      # member tightens the gate automatically with no edit here. A
      # regression that drops one package's pair will fail the assert
      # — the looser "at least one" gate this replaces could not.
      - name: Assert expected artefact set
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          expected=$(find packages -mindepth 2 -maxdepth 2 -name pyproject.toml | wc -l)
          # `nullglob` makes an unmatched glob expand to nothing
          # rather than the literal pattern, so the array stays empty
          # when the build step (above) failed and produced no dist/.
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [[ -d dist ]]; then
            echo "Built artefacts in dist/:"
            ls -1 dist/ | sed 's/^/  /'
          else
            echo "No dist/ directory — build step failed before producing any artefacts."
          fi
          fail=0
          if [[ "${#wheels[@]}" -ne "${expected}" ]]; then
            echo "::error::expected ${expected} .whl artefacts (one per workspace member), got ${#wheels[@]}"
            fail=1
          fi
          if [[ "${#sdists[@]}" -ne "${expected}" ]]; then
            echo "::error::expected ${expected} .tar.gz sdist artefacts (one per workspace member), got ${#sdists[@]}"
            fail=1
          fi
          if [[ "${fail}" -eq 0 ]]; then
            echo "OK: ${#wheels[@]} wheel(s), ${#sdists[@]} sdist(s) for ${expected} workspace member(s)."
          fi
          exit "${fail}"

name: Ripsecrets

# `workflow_call` child of `check-security.yml`, itself a child of
# `ci.yml` (parent issue #440). Carries the entropy-scan step
# previously bundled into `check.yml`'s monolithic `check` job
# (issue #459, splitting `check.yml` across the three `check-*`
# parents). Per the Strategy C migration plan agreed on the parent
# issue, this workflow runs alongside the original `check.yml` until
# Phase 5 cuts branch protection over to the `Required checks passed`
# aggregator and the original is deleted.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ripsecrets:
    name: ripsecrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ripsecrets
        # Scan the full tree for committed secrets. Lefthook only catches
        # staged content; this gate catches anything that lands on a branch
        # by some other path (force-push, web edit, merge from a fork).
        # `.secretsignore` excludes generated SVGs whose embedded base64
        # font data trips the high-entropy heuristic.
        run: ripsecrets

name: ripsecrets

# Entropy-scan child of `check-security.yml`. Runs `ripsecrets` on
# the full tree — lefthook only catches staged content, so this gate
# covers anything that lands on a branch through another path
# (force-push, web edit, merge from a fork).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ripsecrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ripsecrets
        # Scan the full tree for committed secrets. Lefthook only catches
        # staged content; this gate catches anything that lands on a branch
        # by some other path (force-push, web edit, merge from a fork).
        # `.secretsignore` excludes generated SVGs whose embedded base64
        # font data trips the high-entropy heuristic.
        run: ripsecrets

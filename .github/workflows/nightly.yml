name: nightly

# Daily-cadence orchestrator. Carries `mutation` today.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC nightly

# Don't cancel an in-flight scheduled run when a manual dispatch arrives:
# nightly checks are expensive and the in-flight result is still useful.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mutation:
    uses: ./.github/workflows/mutation.yml

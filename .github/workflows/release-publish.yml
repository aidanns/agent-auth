# Verification recipe: see SECURITY.md § Supply-chain artifacts.
#
# Per-package distribution model: see ADR 0044. ``uv build
# --all-packages`` produces one wheel + one sdist per workspace
# member; this workflow signs and uploads every artefact as its own
# release asset (each gets its own SBOM, its own cosign bundle, and
# its own .sha256). The SLSA provenance subject set covers every
# wheel + sdist in the release.

name: Release Publish

on:
  push:
    tags: ["v*"]
  # Re-publish path for an existing tag whose original `push: tags:`
  # run produced an incomplete asset set (issue #372). The dispatched
  # run checks out the tag's commit, re-runs the full sign / SBOM /
  # SLSA-provenance chain, and `gh release upload --clobber` overwrites
  # any partial assets idempotently. `workflow_dispatch` only fires the
  # workflow file present on the default branch, so this trigger
  # becomes operational on the first merge that adds it.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re-)publish, e.g. v0.13.0. Must already exist on origin."
        required: true
        type: string

permissions:
  contents: write
  id-token: write

# Group key uses the tag name (not `github.ref`) so a `workflow_dispatch`
# re-publish shares a queue with the original `push: tags` run for the
# same tag — `github.ref` is `refs/heads/main` for dispatch and
# `refs/tags/vX.Y.Z` for tag pushes, which would otherwise key
# different groups.
concurrency:
  group: release-publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      # base64-encoded sha256 digests of every wheel + sdist subject
      # in the release, fed to the SLSA generator reusable workflow to
      # bind the provenance attestation to those artefacts.
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      # `ref:` lets `workflow_dispatch` runs check out the input tag's
      # commit instead of the default branch's tip. For `push: tags:`,
      # `inputs.tag` is empty and the fallback to `github.ref`
      # (`refs/tags/vX.Y.Z`) preserves the original behaviour.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.7"
          enable-cache: true

      - name: Build per-package sdists and wheels
        # Single source of truth shared with `release-dryrun.yml`. See
        # `scripts/build-release-artifacts.sh` and issues #324 / #325.
        # The script invokes ``uv build --all-packages`` so every
        # workspace member produces one wheel + one sdist.
        run: scripts/build-release-artifacts.sh

      - name: Verify built artefact versions match the release tag
        # Guards the v0.16.0 regression (#408): every wheel + sdist
        # filename must include the tag's version string. Fails fast
        # before signing / SBOM / upload would otherwise pin
        # ``0.0.0+unknown`` artefacts to the release. The test in
        # ``tests/test_release_wheel_version.py`` covers the same
        # invariant at PR time (via ``release-dryrun.yml``); this
        # step is the belt-and-braces gate on the publish path
        # itself, so a regression that slips past the dry-run
        # (broken checkout config, tag-resolution mismatch, …)
        # cannot still produce a signed release with the wrong
        # filenames.
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # ``nullglob`` makes an unmatched glob expand to nothing
          # instead of the literal pattern. Without it, an empty
          # ``dist/`` would expand ``dist/*.whl`` to itself and the
          # loop body would run once with a bogus filename — the
          # ``[[ ... ]]`` check would silently fail-pass through the
          # comparison or trip on a missing file. The explicit
          # empty-dist guard below then turns "build produced zero
          # artefacts" into a loud workflow failure rather than a
          # vacuous "all 0 artefacts carry the expected version".
          shopt -s nullglob
          # Strip the leading ``v`` from the tag (``v0.16.1`` -> ``0.16.1``)
          # so the comparison matches setuptools-scm's PEP-440 output.
          expected_version="${TAG#v}"
          artefacts=(dist/*.whl dist/*.tar.gz)
          if (( ${#artefacts[@]} == 0 )); then
            echo "::error::dist/ is empty — build produced no artefacts (regression of #408 or upstream build failure)"
            exit 1
          fi
          fail=0
          for f in "${artefacts[@]}"; do
            base="$(basename "${f}")"
            if [[ "${base}" != *"-${expected_version}-"* && "${base}" != *"-${expected_version}.tar.gz" ]]; then
              echo "::error::artefact ${base} does not carry expected version ${expected_version} (regression of #408)"
              fail=1
            fi
          done
          if [[ "${fail}" -eq 0 ]]; then
            echo "All ${#artefacts[@]} built artefacts carry version ${expected_version}."
          fi
          exit "${fail}"

      - name: Generate sha256 sidecar files
        # One ``<artefact>.sha256`` per wheel + sdist for the install
        # scripts to verify against without round-tripping the
        # GitHub-API release-asset metadata. Filenames are basename-
        # only so the sidecar's ``sha256sum -c`` works in any cwd.
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for f in *.whl *.tar.gz; do
            sha256sum "${f}" > "${f}.sha256"
          done

      - name: Install Syft
        # Pre-install syft so the per-artefact SBOM loop below can
        # invoke it directly. ``anchore/sbom-action`` wraps a single
        # syft call per step invocation, which would mean N action
        # invocations for N artefacts; the ``download-syft``
        # sub-action installs the binary once and lets us loop in a
        # single ``run:`` block.
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Emit per-artefact SPDX SBOMs
        # One ``<artefact>.spdx.json`` per wheel + sdist so each
        # consumer can read the SBOM matching the wheel they
        # downloaded.
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for f in *.whl *.tar.gz; do
            echo "::group::SBOM for ${f}"
            syft scan "file:${f}" -o "spdx-json=${f}.spdx.json"
            echo "::endgroup::"
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Sign every artefact and SBOM (keyless)
        # Cosign signs each wheel, each sdist, and each SBOM with the
        # runner's ephemeral OIDC identity. Bundle layout:
        # ``<artefact>.sig.bundle`` — sig of the artefact;
        # ``<artefact>.spdx.json.sig.bundle`` — sig of its SBOM.
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for f in *.whl *.tar.gz *.spdx.json; do
            echo "::group::cosign sign ${f}"
            cosign sign-blob --yes --bundle "${f}.sig.bundle" "${f}"
            echo "::endgroup::"
          done

      - name: Compute artefact hashes for SLSA provenance
        id: hashes
        # The SLSA generator expects ``base64(sha256sum file1 file2 ...)``.
        # The subject set is every wheel + sdist (NOT the SBOMs or
        # signatures — the provenance attests the *built artefacts*,
        # and those alone are what consumers verify with
        # slsa-verifier). Use basenames so the provenance subjects
        # match the names visible on the release page. Sorting by name
        # makes the subject order deterministic across re-runs.
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          mapfile -t subjects < <(printf '%s\n' *.whl *.tar.gz | sort)
          digest=$(sha256sum "${subjects[@]}" | base64 -w0)
          echo "hashes=${digest}" >> "${GITHUB_OUTPUT}"

      # Mint an App installation token so the asset-upload events show
      # `agent-auth-release-bot[bot]` as the actor in the audit trail and
      # release timeline, matching release-pr.yml and release-tag.yml.
      # The App's `contents: write` installation permission covers the
      # `gh release upload` call (no workflow-level perms change needed).
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Upload artefacts to GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # One asset per artefact-derived file: wheel, sdist, sha256
        # sidecars, SBOMs, and every cosign bundle. ``--clobber`` lets
        # a rerun overwrite if a previous attempt half-uploaded.
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # Glob expansions are deterministic enough for ``gh release
          # upload`` to pick them up in one call.
          gh release upload "${TAG}" \
            *.whl *.whl.sha256 *.whl.sig.bundle \
            *.tar.gz *.tar.gz.sha256 *.tar.gz.sig.bundle \
            *.spdx.json *.spdx.json.sig.bundle \
            --clobber

  # SLSA Level 3 build provenance attestation. The reusable workflow runs
  # on GitHub's isolated generator runners (not our `publish` runner) so
  # the provenance cannot be forged by a malicious step in `publish`. The
  # generator uploads `multiple.intoto.jsonl` to the release alongside the
  # signed artefacts; verification uses `slsa-verifier verify-artifact`
  # (see SECURITY.md § Supply-chain artifacts).
  #
  # Exception to the SHA-pin policy in
  # `.claude/instructions/tooling-and-ci.md`: slsa-github-generator's
  # reusable workflow MUST be referenced by tag, not commit SHA — the
  # workflow introspects its own `@ref` to certify the builder identity in
  # the emitted provenance. See
  # https://github.com/slsa-framework/slsa-github-generator/blob/main/internal/builders/generic/README.md#referencing-the-slsa-generator.
  provenance:
    needs: [publish]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.publish.outputs.hashes }}
      upload-assets: true

  # Post-publish smoke test (#325). Enumerates the assets actually
  # attached to the GitHub release and fails the workflow if any
  # category is missing. Catches the silent-drop failure mode where
  # the build succeeds but an upload step regresses (e.g. a
  # `gh release upload` flag change, a permissions tightening, a typo
  # in the asset list). The full asset set lives in `publish` and the
  # SLSA `multiple.intoto.jsonl` lives in `provenance`, so this job
  # gates on both.
  #
  # Per-package release-asset layout (ADR 0044): one wheel + one sdist
  # per workspace member, one SBOM per artefact (so 2N SBOMs), one
  # cosign bundle per signed file (each artefact + each SBOM, so 4N
  # bundles), and one SLSA provenance file per release. The expected
  # member count is derived from `packages/<svc>/pyproject.toml` so a
  # new workspace member tightens the gate automatically.
  verify-assets:
    needs: [publish, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Only need `packages/` to count workspace members; a shallow
          # clone is enough. `ref:` matches the tag the publish job
          # built against so the workspace member count read from
          # `packages/<svc>/pyproject.toml` reflects the per-tag layout
          # — re-publishing an old tag whose member count differs from
          # `main`'s would otherwise mis-derive the expected counts.
          fetch-depth: 1
          ref: ${{ inputs.tag || github.ref }}
      - name: Verify expected release assets are uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          # Workspace member count (matches `[tool.uv.workspace].members
          # = ["packages/*"]` in the root pyproject.toml). Drives every
          # per-package count below.
          members=$(find packages -mindepth 2 -maxdepth 2 -name pyproject.toml | wc -l)
          if [[ "${members}" -lt 1 ]]; then
            echo "::error::no workspace members found under packages/* — release-asset count derivation is broken"
            exit 1
          fi

          # `gh release view --json assets` returns one record per
          # uploaded asset. The publish + provenance jobs upload in
          # different steps; with both jobs in `needs:` GitHub blocks
          # this job until they finish, so the asset set is final by
          # the time we read it.
          assets="$(gh release view "${TAG}" --json assets --jq '[.assets[].name]')"

          # `count <jq-filter>` returns the number of asset names
          # matching the filter. ``test`` lets us match by suffix;
          # `endswith` is sufficient because every asset name ends in
          # the category-defining suffix (`.whl`, `.tar.gz`,
          # `.spdx.json`, `.sig.bundle`, `.intoto.jsonl`).
          count() {
            jq -r "[.[] | select($1)] | length" <<<"${assets}"
          }

          wheels="$(count 'endswith(".whl")')"
          sdists="$(count 'endswith(".tar.gz")')"
          # `.sha256` sidecars are uploaded for every wheel + sdist
          # (the install scripts read them for tamper-evident
          # verification). `endswith(".sha256")` matches both
          # `<wheel>.sha256` and `<sdist>.sha256`.
          sha256_sidecars="$(count 'endswith(".sha256")')"
          # SBOM files end in `.spdx.json`; cosign bundles end in
          # `.sig.bundle` and may sign either an artefact or its SBOM.
          sboms="$(count 'endswith(".spdx.json")')"
          cosign_bundles="$(count 'endswith(".sig.bundle")')"
          # SLSA provenance comes from the reusable generator as a
          # single `multiple.intoto.jsonl` file (one per release).
          slsa="$(count 'endswith(".intoto.jsonl")')"

          expected_wheels="${members}"
          expected_sdists="${members}"
          expected_sha256_sidecars=$((members * 2))
          expected_sboms=$((members * 2))
          expected_cosign_bundles=$((members * 4))

          echo "Release ${TAG} assets (workspace members=${members}):"
          echo "  wheels=${wheels} (expected ${expected_wheels})"
          echo "  sdists=${sdists} (expected ${expected_sdists})"
          echo "  sha256_sidecars=${sha256_sidecars} (expected ${expected_sha256_sidecars})"
          echo "  sboms=${sboms} (expected ${expected_sboms})"
          echo "  cosign_bundles=${cosign_bundles} (expected ${expected_cosign_bundles})"
          echo "  slsa=${slsa} (expected 1)"
          echo "Asset list:"
          jq -r '.[]' <<<"${assets}" | sed 's/^/  /'

          fail=0
          [[ "${wheels}" -eq "${expected_wheels}" ]] || { echo "::error::expected ${expected_wheels} .whl assets (one per workspace member), got ${wheels}"; fail=1; }
          [[ "${sdists}" -eq "${expected_sdists}" ]] || { echo "::error::expected ${expected_sdists} .tar.gz sdist assets (one per workspace member), got ${sdists}"; fail=1; }
          [[ "${sha256_sidecars}" -eq "${expected_sha256_sidecars}" ]] || { echo "::error::expected ${expected_sha256_sidecars} .sha256 sidecars (one per wheel + one per sdist), got ${sha256_sidecars}"; fail=1; }
          [[ "${sboms}" -eq "${expected_sboms}" ]] || { echo "::error::expected ${expected_sboms} .spdx.json SBOMs (one per wheel + one per sdist), got ${sboms}"; fail=1; }
          [[ "${cosign_bundles}" -eq "${expected_cosign_bundles}" ]] || { echo "::error::expected ${expected_cosign_bundles} .sig.bundle cosign signatures (one per artefact + one per SBOM), got ${cosign_bundles}"; fail=1; }
          [[ "${slsa}" -eq 1 ]] || { echo "::error::expected exactly 1 SLSA provenance file (multiple.intoto.jsonl) on release ${TAG}, got ${slsa}"; fail=1; }

          exit "${fail}"

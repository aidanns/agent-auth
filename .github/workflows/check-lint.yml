name: check-lint

# Lint / static-analysis child of `ci.yml`. Carries `python` (mypy +
# pyright) and `systems-engineering` (verify-design +
# verify-function-tests).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    uses: ./.github/workflows/python.yml
    secrets: inherit

  systems-engineering:
    uses: ./.github/workflows/systems-engineering.yml
    secrets: inherit

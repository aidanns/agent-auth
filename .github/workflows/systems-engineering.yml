name: systems-engineering

# Systems-engineering traceability child of `check-lint.yml`. Two
# parallel siblings: `verify-design` (every function is allocated)
# and `verify-function-tests` (every function has test coverage).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all functions are allocated
        run: task verify-design

  verify-function-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all functions have test coverage
        run: task verify-function-tests

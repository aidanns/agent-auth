name: check-fmt

# Formatting / lint child of `ci.yml`. Carries `spdx-license-headers`
# (REUSE lint), `treefmt`, and `ruff-format`.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  spdx-license-headers:
    uses: ./.github/workflows/spdx-license-headers.yml

  treefmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run treefmt --ci
        # `scripts/lint.sh` + `scripts/format.sh` invoke each per-language
        # formatter directly, so they don't exercise `treefmt.toml` itself.
        # This job catches a broken or stale `treefmt.toml` (missing
        # formatter entry, wrong includes, drift from the per-tool
        # configs) that the direct path would miss. Mirrors the
        # `treefmt --ci` step in the legacy `check.yml` byte-for-byte.
        run: treefmt --ci

  ruff-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ruff format --check
        # Mirror `scripts/format.sh --check`'s ruff invocation: scope to
        # tracked `*.py` files via `git ls-files` so the formatting
        # surface matches what authors run locally. `treefmt --ci` (the
        # sibling job above) also exercises `ruff format` via
        # `treefmt.toml`, but a separate sibling here keeps the failure
        # signal split — ruff drift surfaces independently of any
        # treefmt-config drift.
        run: |
          set -euo pipefail
          python_files_raw="$(git ls-files '*.py')"
          if [[ -z "${python_files_raw}" ]]; then
            echo "No *.py files tracked; skipping ruff format --check."
            exit 0
          fi
          mapfile -t python_files <<<"${python_files_raw}"
          ruff format --check "${python_files[@]}"

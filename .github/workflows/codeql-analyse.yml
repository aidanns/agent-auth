name: codeql-analyse

# CodeQL `analyze (python)` / `analyze (actions)` matrix child of
# `check-security.yml`. Workflow_call only — daily-cron coverage
# lives in `nightly.yml` if/when added.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # ``python`` covers the packages/ + tests/ Python surface; ``actions``
        # covers workflow files under .github/ so a dangerous
        # script-injection pattern in a new workflow lands in the
        # Security tab rather than going unnoticed.
        language: [python, actions]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Explicit security-extended suite: default ``security`` is
          # high-precision but narrow; extended adds medium-precision
          # queries that routinely surface real issues on the Python
          # surface (e.g. clear-text logging, weak crypto choices).
          queries: security-extended
          # ``.github/codeql/codeql-config.yml`` carries
          # ``path-classifiers`` that mark the workspace test trees and
          # the ``tests_support`` library as test code so test-only
          # patterns (e.g. world-readable bind-mount perms in
          # ``tests_support.integration.plugin``) don't trigger
          # production-grade queries.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

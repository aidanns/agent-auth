name: weekly

# Weekly-cadence orchestrator. Carries `bench` and `open-ssf-scorecard`.
#
# Sunday 05:00 UTC is offset from `nightly.yml`'s Mon 04:00 UTC slot to
# avoid sharing a runner window — keep them apart when adding more
# weekly children.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 0" # 05:00 UTC every Sunday

# Don't cancel an in-flight scheduled run when a manual dispatch arrives:
# weekly checks are expensive and the in-flight result is still useful.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bench:
    uses: ./.github/workflows/bench.yml

  open-ssf-scorecard:
    # `workflow_call` children's permissions are capped by the caller
    # job's permission set; re-declare the union of the child's
    # per-job permissions here so the SARIF upload + signed
    # publication don't startup_failure.
    permissions:
      security-events: write
      id-token: write
      actions: read
      contents: read
    uses: ./.github/workflows/open-ssf-scorecard.yml

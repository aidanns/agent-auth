name: pr-lint

# Residual top-level workflow for two meta self-tests that don't belong
# under `ci.yml` (they're checks on workflow YAML / lint constants, not
# per-PR validators):
#
# - `pr-title-types-self-test` — asserts the `types: |` allowlist in
#   `check-pull-request.yml`'s `title-prefix` job stays in lockstep
#   with `scripts/lint/commit_taxonomy.py::ALLOWED_TYPES`.
# - `predict-release-impact-self-test` — exercises the predict
#   script's bump matrix on every run.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title-types-self-test:
    runs-on: ubuntu-latest
    # Asserts the explicit `types:` allowlist on the
    # `amannn/action-semantic-pull-request` step in
    # `check-pull-request.yml`'s `title-prefix` job stays in lockstep
    # with `scripts/lint/commit_taxonomy.py::ALLOWED_TYPES`. Without
    # this self-test the YAML and the Python module could drift — a
    # type added to one but not the other would silently change which
    # PR titles the lint accepts vs. which the changelog tooling
    # understands. See issue #405. Migrated YAML target from
    # `pr-lint.yml` to `check-pull-request.yml` in #463.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Assert check-pull-request.yml types match commit_taxonomy.ALLOWED_TYPES
        run: |
          set -euo pipefail
          python3 scripts/lint/commit_taxonomy.py check-pr-lint-yaml

  predict-release-impact-self-test:
    runs-on: ubuntu-latest
    # Exercise the predict script's bump matrix on every run so a
    # regression in the prediction surface (e.g. the bump enum
    # gaining a new variant whose label is not rendered) immediately
    # fails CI rather than silently emitting a wrong comment.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install runtime deps (PyYAML, pytest)
        run: pip install --no-cache-dir 'pyyaml>=6' 'pytest>=8'

      - name: Run predict_release_impact unit tests
        run: |
          set -euo pipefail
          # `conftest.py` under scripts/changelog/tests/ puts
          # scripts/changelog/ and scripts/lint/ on sys.path so the
          # bare-name imports in the test file resolve.
          # `-o addopts=` overrides the workspace `pyproject.toml`'s
          # `[tool.pytest.ini_options].addopts` (which injects
          # `--cov=packages --cov-branch --cov-report=term-missing`).
          # Without this override, bare pytest would reject those
          # flags with `error: unrecognized arguments` and exit 4
          # because this isolated job intentionally does not install
          # `pytest-cov`; the job exercises one script in isolation,
          # not the workspace's full coverage matrix.
          python3 -m pytest -o addopts= scripts/changelog/tests/test_predict_release_impact.py -v

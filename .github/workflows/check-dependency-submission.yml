name: check-dependency-submission

# Tool-versions Dependency Graph snapshot child of
# `check-security.yml`. `pull_request` only via the `ci.yml` chain;
# fork PRs short-circuit to `success` (their read-only
# `GITHUB_TOKEN` would 403 the snapshot POST, and ci.yml's
# aggregator rejects `skipped` per #441).

on:
  workflow_call:
    inputs:
      event_from_external_repo:
        description: True for `pull_request` events from a fork.
        required: true
        type: boolean

permissions:
  # Required to POST to /repos/{owner}/{repo}/dependency-graph/snapshots.
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: ${{ !inputs.event_from_external_repo }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build and submit snapshot
        if: ${{ !inputs.event_from_external_repo }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANIFEST_PATH: .github/tool-versions.yml
        run: bash scripts/ci/submit-dependency-snapshot.sh

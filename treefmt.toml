# treefmt formatter/linter multiplexer.
# shfmt formatting options live in .editorconfig.
# ruff formatting options live in pyproject.toml ([tool.ruff]).
# mdformat reads .mdformat.toml; taplo reads taplo.toml.
# The authoritative project gate is scripts/lint.sh + scripts/format.sh,
# invoked directly by .github/workflows/check.yml and lefthook.yml.

[formatter.mdformat]
command = "mdformat"
includes = ["*.md"]
# pr-lint validator fixtures are byte-exact PR-body inputs — mdformat
# would escape literal `<n>.` / `<n>)` lines (CommonMark ordered-list
# markers) and defeat the very tests that exercise the validator's
# numbered-list discrimination (#358). Keep these files unformatted.
excludes = [".github/workflows/tests/pr-lint-fixtures/*.md"]

[formatter.ruff]
command = "ruff"
options = ["format"]
includes = ["*.py"]

[formatter.shellcheck]
command = "shellcheck"
includes = ["*.sh"]

[formatter.shfmt]
command = "shfmt"
options = ["-w"]
includes = ["*.sh"]

[formatter.taplo]
command = "taplo"
options = ["format"]
includes = ["*.toml"]

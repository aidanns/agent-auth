type: feature
feature:
  description: |
    Per-package dependency license allowlist gate. A new
    `check-license-allowlist` matrix child of `ci.yml` enumerates each
    workspace member's resolved closure (runtime + workspace dev) and
    fails the PR when any dep declares a license outside the
    permissive allowlist (`MIT` / `Apache-2.0` / `BSD-2-Clause` /
    `BSD-3-Clause` / `ISC` / `Python-2.0` / `MPL-2.0`) without a
    matching non-expired entry under
    `packages/<svc>/licenses.exceptions.yml`. SPDX disjunctions
    (`A OR B`) pick the first allowlisted alternative; conjunctions
    (`A AND B`) require every component to be allowed. See ADR 0048.
  links:
    - https://github.com/aidanns/agent-auth/pull/595
